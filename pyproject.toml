[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routellm"
version = "0.1.0"
description = "An explainable, local routing layer for natural-language requests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "RouteLLM contributors" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
routellm = "routellm.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/routellm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["routellm"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
